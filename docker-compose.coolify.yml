name: quickvoice-coolify

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: quickvoice-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "5000"
      NODE_ENV: "production"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-quickvoice_auth_secret_minimum_32_characters_long}"
      BETTER_AUTH_URL: "${SERVER_URL:-https://web.cochindigitalsystem.com}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-quickvoice_internal_secret_key}"
      AI_API_URL: "http://ai:5555"
      CONSOLE_URL: "${CONSOLE_URL:-https://app.cochindigitalsystem.com}"
      LANDING_URL: "${LANDING_URL:-https://cochindigitalsystem.com}"
      REQUIRE_EMAIL_VERIFICATION: "${REQUIRE_EMAIL_VERIFICATION:-false}"
      # LiveKit Realtime & SIP
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      LIVEKIT_SIP_INBOUND_TRUNK_ID: "${LIVEKIT_SIP_INBOUND_TRUNK_ID:-}"
      LIVEKIT_SIP_OUTBOUND_TRUNK_TWILIO_ID: "${LIVEKIT_SIP_OUTBOUND_TRUNK_TWILIO_ID:-}"
      LIVEKIT_SIP_OUTBOUND_TRUNK_TELNYX_ID: "${LIVEKIT_SIP_OUTBOUND_TRUNK_TELNYX_ID:-}"
      LIVEKIT_SIP_OUTBOUND_TRUNK_VOBIZ_ID: "${LIVEKIT_SIP_OUTBOUND_TRUNK_VOBIZ_ID:-}"
      # Telephony Providers
      TELNYX_API_KEY: "${TELNYX_API_KEY:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      VOBIZ_AUTH_ID: "${VOBIZ_AUTH_ID:-}"
      VOBIZ_AUTH_TOKEN: "${VOBIZ_AUTH_TOKEN:-}"
      # Billing
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      # Optional S3 Storage (empty by default)
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      S3_BUCKET_NAME: "${S3_BUCKET_NAME:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
    networks:
      - quickvoice-network

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: "QuickVoice"
        NEXT_PUBLIC_SERVER_URL: "${SERVER_URL:-https://web.cochindigitalsystem.com}"
        NEXT_PUBLIC_CONSOLE_URL: "${CONSOLE_URL:-https://app.cochindigitalsystem.com}"
        NEXT_PUBLIC_LANDING_URL: "${LANDING_URL:-https://cochindigitalsystem.com}"
        NEXT_PUBLIC_API_VERSION: "v1"
    container_name: quickvoice-console
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_NAME: "QuickVoice"
      NEXT_PUBLIC_SERVER_URL: "${SERVER_URL:-https://web.cochindigitalsystem.com}"
      NEXT_PUBLIC_CONSOLE_URL: "${CONSOLE_URL:-https://app.cochindigitalsystem.com}"
      NEXT_PUBLIC_LANDING_URL: "${LANDING_URL:-https://cochindigitalsystem.com}"
      NEXT_PUBLIC_API_VERSION: "v1"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
    depends_on:
      - server
    networks:
      - quickvoice-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        FAST_BUILD: "true"
        NEXT_PUBLIC_CONSOLE_URL: "${CONSOLE_URL:-https://app.cochindigitalsystem.com}"
    container_name: quickvoice-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      NEXT_PUBLIC_CONSOLE_URL: "${CONSOLE_URL:-https://app.cochindigitalsystem.com}"
    depends_on:
      - server
    networks:
      - quickvoice-network

  ai:
    build:
      context: apps/ai
      dockerfile: Dockerfile
      args:
        PREINSTALL_CPU_TORCH: "true"
        SKIP_MODEL_DOWNLOAD: "true"
    container_name: quickvoice-ai
    restart: unless-stopped
    ports:
      - "${AI_PORT:-5555}:5555"
    environment:
      AI_API_PORT: "5555"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-quickvoice_internal_secret_key}"
      SERVER_URL: "http://server:5000"
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      # STT Providers
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-}"
      SARVAM_API_KEY: "${SARVAM_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # TTS Providers
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      CARTESIA_API_KEY: "${CARTESIA_API_KEY:-}"
      # LLM Providers
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # AWS Bedrock
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    depends_on:
      - server
    networks:
      - quickvoice-network

networks:
  quickvoice-network:
    driver: bridge
